stages:
  prepare:
    cmd: python -m src.data.dataset
    deps:
      - src/data/dataset.py
      # Les listes de fichiers + les labels identifient les données ; on ne hache pas les
      # 14 Go d'images à chaque exécution (30 min sur Kaggle) : elles sont figées par la liste.
      - data/raw/train_files.txt
      - data/raw/val_files.txt
      - data/raw/labels
    params:
      - prepare
    outs:
      - data/processed
